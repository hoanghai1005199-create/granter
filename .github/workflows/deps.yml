name: Deps
on:
  push:
    branches: [test-recompile]
jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle :app:dependencies --configuration debugCompileClasspath | grep -i -E "sun-security|libadb|conscrypt|FAILED"
